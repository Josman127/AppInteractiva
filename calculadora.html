<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Resume - Start Bootstrap Theme</title>
        <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico" />
        <!-- Font Awesome icons (free version)-->
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <!-- Google fonts-->
        <link href="https://fonts.googleapis.com/css?family=Saira+Extra+Condensed:500,700" rel="stylesheet" type="text/css" />
        <link href="https://fonts.googleapis.com/css?family=Muli:400,400i,800,800i" rel="stylesheet" type="text/css" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />
        
    </head>
    <body id="page-top">
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top" id="sideNav">
            <a class="navbar-brand js-scroll-trigger" href="#page-top">
                <!-- Nombre e Imagen en uso -->
                <span class="d-block d-lg-none" id="nombre"></span>
                <span class="d-none d-lg-block"><img id="img" class="img-fluid img-profile rounded-circle mx-auto mb-2" src="img/img-usuario.svg" alt="..." /></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <form class="d-flex justify-content-center">
                            <select class="form-select w-50" id="">
                                <option value="persona1">Persona 1</option>
                            </select>
                        </form>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link js-scroll-trigger active" href="index.html">Index</a>
                    </li>
                </ul>
            </div>
        </nav>
        <!-- Page Content-->
        <section class="container rounded-3 mt-4 bg-secondary bg-gradient">
            <div class="row">
                <div class="col">
                    <div class="card p-4 shadow ">
                        <!-- input -->
                        <input type="text" class="form-control text-end mb-3" placeholder="0" id="input" readonly>
                        <!-- cuerpo -->
                        <div class="row g-2">
                        <!-- Números y operadores -->
                        <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">7</button></div>
                        <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">8</button></div>
                        <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">9</button></div>
                        <div class="col-3"><button class="btn btn-warning w-100 calc-btn">/</button></div>
                        <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">4</button></div>
                        <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">5</button></div>
                        <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">6</button></div>
                        <div class="col-3"><button class="btn btn-warning w-100 calc-btn">*</button></div>
                        <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">1</button></div>
                        <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">2</button></div>
                        <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">3</button></div>
                        <div class="col-3"><button class="btn btn-warning w-100 calc-btn">-</button></div>
                        <div class="col-3"><button class="btn btn-danger w-100" id="clear">C</button></div>
                        <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">0</button></div>
                        <div class="col-3"><button class="btn btn-success w-100" id="equals">=</button></div>
                        <div class="col-3"><button class="btn btn-warning w-100 calc-btn">+</button></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Js -->
        <script src="js/micodigo.js"></script>
    </body>
</html>
